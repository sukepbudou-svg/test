<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャラクターメーカー</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9; --panel: #fff; --text: #1f2328; --muted: #656d76;
    --line: #d0d7de; --accent: #2f6feb; --accent-text: #fff; --danger: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8d96a0;
      --line: #30363d; --accent: #4493f8; --accent-text: #fff; --danger: #f85149;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8d96a0;
      --line: #30363d; --accent: #4493f8; --accent-text: #fff; --danger: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
         font-size: 15px; line-height: 1.6; }
  header { padding: 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 20px; }
  main { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 20px 0 8px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  select, input[type=text], textarea {
    width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  textarea { min-height: 120px; resize: vertical; }
  .other { margin-top: 6px; }
  button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
           color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--danger); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .list li:hover { border-color: var(--line); }
  .list li.active { border-color: var(--accent); }
  .list .sub { font-size: 12px; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 8px 16px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .gen { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 4px; }
</style>
</head>
<body>
<header><h1>キャラクターメーカー</h1></header>
<main>
  <section>
    <h2>キャラクター一覧</h2>
    <ul class="list" id="list"></ul>
    <div class="row">
      <button class="primary" id="new">＋ 新規作成</button>
    </div>
    <div class="row">
      <button id="export">書き出し</button>
      <button id="import">読み込み</button>
    </div>
    <div id="backup" hidden style="margin-top:12px">
      <label for="backupText" id="backupLabel"></label>
      <textarea id="backupText" style="min-height:140px;font-size:12px"></textarea>
      <div class="row">
        <button class="primary" id="backupAction"></button>
        <button id="backupClose">閉じる</button>
      </div>
    </div>
    <p class="hint">データはこのブラウザ内に保存されます。定期的に「書き出し」でバックアップしてください。</p>
  </section>

  <section>
    <h2>プロフィール設定</h2>
    <div class="fields">
      <div><label for="name">キャラクター名</label><input type="text" id="name" placeholder="例：ハル"></div>
    </div>
    <div class="fields" id="fields" style="margin-top:12px"></div>
    <div style="margin-top:12px">
      <label for="memo">補足メモ（自由入力・任意）</label>
      <textarea id="memo" style="min-height:70px" placeholder="例：関西弁で話す、甘えん坊"></textarea>
    </div>
    <div class="row">
      <button id="random">ランダムで選ぶ</button>
      <button class="primary" id="save">保存</button>
      <button class="danger" id="delete">削除</button>
    </div>

    <div class="gen">
      <h3>名前の候補</h3>
      <div class="fields">
        <div><label for="nameStyle">名前の雰囲気</label><select id="nameStyle"></select></div>
        <div><label for="nameCount">候補の数</label>
          <select id="nameCount"><option>5個</option><option selected>10個</option><option>20個</option></select></div>
      </div>
      <p class="hint" id="nameStyleHint"></p>
      <div class="row"><button id="copyName">指示文をコピー</button>
        <span class="hint">→ claude.ai に貼り付けて、気に入った名前を上の「キャラクター名」に入力</span></div>
    </div>

    <div class="gen">
      <h3>① 声かけメッセージ（タイトル＋本文）</h3>
      <div class="fields">
        <div><label for="approachLen">長さ</label>
          <select id="approachLen"><option>短め（50字程度）</option><option selected>普通（100〜150字）</option><option>長め（200〜300字）</option></select></div>
        <div><label for="approachCount">作成数</label>
          <select id="approachCount"><option>1案</option><option selected>3案</option><option>5案</option></select></div>
      </div>
      <div style="margin-top:12px">
        <label for="target">声をかける相手の投稿・プロフィール（任意）</label>
        <textarea id="target" style="min-height:70px" placeholder="相手の掲示板投稿などを貼ると、その内容に合わせた声かけになります（空欄なら一般的な声かけ）"></textarea>
      </div>
      <div class="row"><button id="copyApproach">指示文をコピー</button>
        <span class="hint">→ claude.ai に貼り付けて、できた文章を下に貼って保存</span></div>
      <div style="margin-top:8px"><textarea id="approachText" placeholder="claude.ai で作成した声かけメッセージを貼り付け"></textarea></div>

      <h3>② 掲示板本文</h3>
      <div class="fields">
        <div><label for="boardPattern">書き方のパターン</label><select id="boardPattern"></select></div>
        <div><label for="boardLen">長さ</label>
          <select id="boardLen"><option>短め（100字程度）</option><option selected>普通（200字程度）</option><option>長め（300〜400字）</option></select></div>
        <div><label for="boardCount">作成数</label>
          <select id="boardCount"><option>1案</option><option selected>3案</option><option>5案</option></select></div>
      </div>
      <p class="hint" id="patternHint"></p>
      <div class="row"><button id="copyBoard">指示文をコピー</button></div>
      <div style="margin-top:8px"><textarea id="boardText" placeholder="claude.ai で作成した掲示板本文を貼り付け"></textarea></div>
      <div class="row"><button class="primary" id="save2">保存</button></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
// ===== 項目と選択肢の設定 =====
// 項目を追加するときは、この配列に { key, label, options } を追加してください。
// key は英数字の一意な名前、options の先頭が初期値になります。
const range = (from, to, unit) => Array.from({ length: to - from + 1 }, (_, i) => `${from + i}${unit}`);
const OTHER = 'その他（自由入力）';

const FIELDS = [
  { key: 'age',     label: '年齢', options: ['未設定', ...range(18, 70, '歳')] },
  { key: 'role',    label: '役割', options: ['未設定', 'タチ', 'ウケ', 'リバ'] },
  { key: 'height',  label: '身長', options: ['未設定', ...range(150, 200, 'cm')] },
  { key: 'weight',  label: '体重', options: ['未設定', ...range(40, 150, 'kg')] },
  { key: 'body',    label: '体型', options: ['未設定', '標準体型', '筋肉質', '肥満系'] },
  { key: 'job',     label: '職業', options: [
    '未設定', '会社員（営業）', '会社員（事務）', '会社員（企画・マーケティング）', '会社員（管理職）',
    'エンジニア・IT', '公務員', '警察官', '消防士', '自衛官', '教師・講師',
    '医師', '看護師', '介護士', '薬剤師', '保育士', '美容師・理容師',
    '料理人', '飲食店スタッフ', '販売・接客', 'ホテル・旅行業', '金融・保険', '不動産',
    '士業（弁護士・税理士など）', '建設・現場作業', '職人', '工場勤務', '運転手・配送', '整備士',
    '農業・漁業', '警備員', 'トレーナー・インストラクター', 'スポーツ選手',
    'デザイナー・クリエイター', '芸能・モデル', '経営者・自営業', 'フリーランス',
    '大学生・専門学校生', 'フリーター', '無職' ] },
  { key: 'purpose', label: '目的', options: ['未設定', '真面目', 'エロ', 'なんでも'] },
];
// ==============================

// 名前の雰囲気。追加するときは { name, how } を足してください。
const NAME_STYLES = [
  { name: '普通の名前', how: '日常でよく見かける、自然で親しみやすい名前。' },
  { name: '職業・キャラ設定に合った名前', how: '職業や性格などの設定から連想される、イメージに合った名前。' },
  { name: 'ユーモアのある名前', how: 'くすっと笑える、遊び心やダジャレのある名前。' },
  { name: '掲示板のハンドルネーム風', how: '掲示板やSNSで使われるような、カタカナ・ひらがな・短い愛称などのハンドルネーム。' },
  { name: 'かっこいい名前', how: '硬派でクール、または大人っぽい印象の名前。' },
  { name: 'かわいい名前', how: 'やわらかく、かわいらしい印象の名前や愛称。' },
  { name: 'おまかせ（いろいろ混ぜる）', how: '上のような雰囲気をいろいろ混ぜて、幅広く提案する。' },
];

// 掲示板本文の書き方パターン。追加するときは { name, how } を足してください。
const BOARD_PATTERNS = [
  { name: '箇条書き', how: 'タイトルの下に、自分のこと・求める相手・条件などを「・」の箇条書きで並べる。' },
  { name: '求める内容だけ淡々と', how: '自己紹介はほぼ省き、求めている相手や内容だけを飾らず淡々と書き連ねる。' },
  { name: '自己紹介＋募集', how: '前半で軽く自己紹介し、後半で求める相手を書く、読みやすい文章形式。' },
  { name: '一言だけ（超短文）', how: '1〜3行程度の短い一言で募集する。長さの指定より短くてよい。' },
  { name: 'くだけたつぶやき風', how: '独り言やSNSのつぶやきのような、ゆるくくだけた口調で書く。' },
  { name: '丁寧・真面目', how: '丁寧語で、誠実さが伝わる落ち着いた文章で書く。' },
  { name: '条件をしっかり書く', how: '年齢・体型・役割など相手に求める条件や、NG事項を具体的に明記する。' },
  { name: 'おまかせ（毎回違う形）', how: '箇条書き・短文・文章形式などを自由に選び、案ごとに違う書き方にする。' },
];

const STORAGE_KEY = 'character-maker-v1';
const $ = (id) => document.getElementById(id);

function loadAll() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function saveAll(chars) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chars)); return true; } catch { return false; }
}

let chars = loadAll();
let currentId = null;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function buildFields() {
  const box = $('fields');
  for (const f of FIELDS) {
    const wrap = document.createElement('div');
    const opts = [...f.options, OTHER].map((o) => `<option>${o}</option>`).join('');
    wrap.innerHTML = `<label for="f_${f.key}">${f.label}</label>
      <select id="f_${f.key}">${opts}</select>
      <input type="text" class="other" id="o_${f.key}" placeholder="${f.label}を入力" hidden>`;
    box.appendChild(wrap);
    $(`f_${f.key}`).addEventListener('change', () => {
      $(`o_${f.key}`).hidden = $(`f_${f.key}`).value !== OTHER;
    });
  }
}

function readForm() {
  const values = {};
  for (const f of FIELDS) {
    const v = $(`f_${f.key}`).value;
    values[f.key] = v === OTHER ? $(`o_${f.key}`).value.trim() || '未設定' : v;
  }
  return {
    name: $('name').value.trim(), values, memo: $('memo').value.trim(),
    approachText: $('approachText').value, boardText: $('boardText').value,
  };
}

function fillForm(c) {
  $('name').value = c?.name || '';
  $('memo').value = c?.memo || '';
  $('approachText').value = c?.approachText ?? c?.profileText ?? '';
  $('boardText').value = c?.boardText || '';
  for (const f of FIELDS) {
    const v = c?.values?.[f.key] ?? f.options[0];
    const known = f.options.includes(v);
    $(`f_${f.key}`).value = known ? v : OTHER;
    $(`o_${f.key}`).value = known ? '' : v;
    $(`o_${f.key}`).hidden = known;
  }
}

function renderList() {
  const ul = $('list');
  ul.innerHTML = '';
  if (!chars.length) { ul.innerHTML = '<li class="sub">まだありません</li>'; return; }
  for (const c of chars) {
    const li = document.createElement('li');
    if (c.id === currentId) li.className = 'active';
    const sub = FIELDS.map((f) => c.values[f.key]).filter((v) => v && v !== '未設定').join(' / ');
    li.innerHTML = `<div></div><div class="sub"></div>`;
    li.firstChild.textContent = c.name || '（名前なし）';
    li.lastChild.textContent = sub;
    li.onclick = () => { currentId = c.id; fillForm(c); renderList(); };
    ul.appendChild(li);
  }
}

function save() {
  const data = readForm();
  if (currentId) {
    const i = chars.findIndex((c) => c.id === currentId);
    chars[i] = { ...chars[i], ...data, updatedAt: new Date().toISOString() };
  } else {
    currentId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
    chars.unshift({ id: currentId, ...data, createdAt: new Date().toISOString() });
  }
  toast(saveAll(chars) ? '保存しました' : '保存できませんでした（書き出しでバックアップしてください）');
  renderList();
}

function describe(data) {
  const lines = [];
  if (data.name) lines.push(`・名前：${data.name}`);
  for (const f of FIELDS) {
    const v = data.values[f.key];
    if (v && v !== '未設定') lines.push(`・${f.label}：${v}`);
  }
  if (data.memo) lines.push(`・補足：${data.memo}`);
  return lines.join('\n');
}

const COMMON_RULES = `・登場人物は18歳以上の架空のキャラクターです。
・職業の指定がない場合は、補足に書かれた職業を使ってください。
・設定にない項目は、設定と矛盾しない範囲で自然に補ってかまいません。
・露骨な性的描写は避けてください。
・完成した文章だけを出力してください（前置きや解説は不要です）。`;

const count = (id) => $(id).value.replace(/[案個]/, '');

function namePrompt(data) {
  const st = NAME_STYLES[$('nameStyle').value];
  const settings = describe({ ...data, name: '' }) || '（特になし）';
  return `ロールプレイ（なりきり）サービスで使うキャラクターの名前の候補を考えてください。

【キャラクター設定】
${settings}

【名前の雰囲気：${st.name}】
${st.how}

【条件】
・候補を${count('nameCount')}個出してください。
・1行に1つ、「名前（読み方）：その名前にした理由を一言」の形で書いてください。
・設定のイメージに合う名前にしてください。職業の指定がない場合は、補足に書かれた職業を参考にしてください。
・実在の有名人と同じ名前は避けてください。
・候補の一覧だけを出力してください（前置きや解説は不要です）。`;
}

function approachPrompt(data) {
  const target = $('target').value.trim();
  const targetBlock = target
    ? `\n【声をかける相手の投稿・プロフィール】\n${target}\n` : '';
  return `ロールプレイ（なりきり）サービスで、下記のキャラクターが相手に初めて声をかけるメッセージを作成してください。

【キャラクター設定】
${describe(data)}
${targetBlock}
【条件】
・1行目にタイトル（件名）、2行目以降に本文を書いてください。
・キャラクター本人の一人称・口調で、設定（特に役割と目的）に合った声のかけ方にしてください。
・${target ? '相手の投稿内容に触れて、その人に向けた声かけにしてください。' : '相手が返信したくなるような、自然な声かけにしてください。'}
・長さ（本文）：${$('approachLen').value}
・${count('approachCount')}案作成し、案ごとに雰囲気や切り口を変えてください。各案の間は「---」で区切ってください。
${COMMON_RULES}`;
}

function boardPrompt(data) {
  const p = BOARD_PATTERNS[$('boardPattern').value];
  return `ロールプレイ（なりきり）サービスの掲示板に、下記のキャラクターとして投稿する募集の本文を作成してください。

【キャラクター設定】
${describe(data)}

【書き方のパターン：${p.name}】
${p.how}

【条件】
・1行目にタイトル、2行目以降に本文を書いてください。
・キャラクター本人の一人称・口調で、目的に合った相手を募集する内容にしてください。
・長さ：${$('boardLen').value}
・${count('boardCount')}案作成し、各案の間は「---」で区切ってください。
${COMMON_RULES}`;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('指示文をコピーしました。claude.ai に貼り付けてください');
}

$('new').onclick = () => { currentId = null; fillForm(null); renderList(); };
$('save').onclick = save;
$('save2').onclick = save;
$('delete').onclick = () => {
  if (!currentId) return;
  const btn = $('delete');
  if (!btn.dataset.armed) {
    btn.dataset.armed = '1'; btn.textContent = 'もう一度押すと削除';
    setTimeout(() => { delete btn.dataset.armed; btn.textContent = '削除'; }, 3000);
    return;
  }
  delete btn.dataset.armed; btn.textContent = '削除';
  chars = chars.filter((c) => c.id !== currentId);
  saveAll(chars); currentId = null; fillForm(null); renderList(); toast('削除しました');
};
$('random').onclick = () => {
  for (const f of FIELDS) {
    const pool = f.options.filter((o) => o !== '未設定');
    $(`f_${f.key}`).value = pool[Math.floor(Math.random() * pool.length)];
    $(`o_${f.key}`).hidden = true;
  }
};
$('copyName').onclick = () => copy(namePrompt(readForm()));
$('copyApproach').onclick = () => copy(approachPrompt(readForm()));
$('copyBoard').onclick = () => copy(boardPrompt(readForm()));

// 書き出し：データを文字で表示してコピー。読み込み：貼り付けた文字から取り込み。
let backupMode = null;
function openBackup(mode) {
  backupMode = mode;
  $('backup').hidden = false;
  if (mode === 'export') {
    $('backupLabel').textContent = '下の文字をすべてコピーして、メモ帳などに保存してください';
    $('backupText').value = JSON.stringify(chars, null, 2);
    $('backupAction').textContent = 'コピー';
  } else {
    $('backupLabel').textContent = '書き出しで保存した文字を貼り付けてください';
    $('backupText').value = '';
    $('backupAction').textContent = '読み込む';
  }
}
$('export').onclick = () => openBackup('export');
$('import').onclick = () => openBackup('import');
$('backupClose').onclick = () => { $('backup').hidden = true; };
$('backupAction').onclick = async () => {
  if (backupMode === 'export') {
    try { await navigator.clipboard.writeText($('backupText').value); toast('コピーしました'); }
    catch { $('backupText').select(); toast('選択しました。Ctrl+C（⌘+C）でコピーしてください'); }
    return;
  }
  try {
    const incoming = JSON.parse($('backupText').value);
    if (!Array.isArray(incoming)) throw new Error();
    const ids = new Set(chars.map((c) => c.id));
    const added = incoming.filter((c) => c && c.id && !ids.has(c.id));
    chars = [...added, ...chars];
    saveAll(chars); renderList(); $('backup').hidden = true;
    toast(`${added.length}件読み込みました`);
  } catch { toast('読み込めませんでした。書き出しで保存した文字をそのまま貼り付けてください'); }
};

buildFields();
$('boardPattern').innerHTML = BOARD_PATTERNS.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
$('nameStyle').innerHTML = NAME_STYLES.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
const showNameHint = () => { $('nameStyleHint').textContent = NAME_STYLES[$('nameStyle').value].how; };
$('nameStyle').onchange = showNameHint;
showNameHint();
const showPatternHint = () => { $('patternHint').textContent = BOARD_PATTERNS[$('boardPattern').value].how; };
$('boardPattern').onchange = showPatternHint;
showPatternHint();
fillForm(null);
renderList();
</script>
</body>
</html>
