<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐻㊙ 裏熊 - 成績記録</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap');
:root {
  --bg: #080c14; --surface: #0d1520; --surface2: #111d2e; --surface3: #162030;
  --accent: #e94560; --accent2: #f5a623; --accent3: #00d4ff;
  --text: #e8edf5; --text-muted: #5a6a80; --border: #1e2d42;
  --green: #00e676; --yellow: #ffd740; --blue: #40c4ff; --input-bg: #060a10;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP','Segoe UI',sans-serif; font-size: 13px; }

.header {
  background: linear-gradient(135deg,#0d1520,#111d2e);
  padding: 14px 24px; display: flex; align-items: center; gap: 16px;
  border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.header::before {
  content: ''; position: absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg,var(--accent3),var(--accent),var(--accent2),var(--accent3));
  background-size: 200% 100%; animation: shimmer 3s linear infinite;
}
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
h1 {
  font-family: 'Orbitron',sans-serif; font-size: 1.2rem; font-weight: 900;
  background: linear-gradient(135deg,#fff,var(--accent2),var(--accent));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.back-btn {
  margin-left: auto; background: var(--surface3); color: var(--accent3);
  border: 1px solid var(--accent3); border-radius: 6px; padding: 6px 14px;
  text-decoration: none; font-size: 12px; font-weight: 700; transition: all 0.2s;
}
.back-btn:hover { background: var(--accent3); color: #000; }

.main { padding: 16px; max-width: 1100px; margin: 0 auto; }

/* サマリーカード */
.summary-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
.summary-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; text-align: center; position: relative; overflow: hidden;
}
.summary-card::before {
  content: ''; position: absolute; top:0; left:0; right:0; height:2px;
}
.summary-card.s-hit::before   { background: var(--green); }
.summary-card.s-rate::before  { background: var(--accent2); }
.summary-card.s-profit::before{ background: var(--accent3); }
.summary-card.s-total::before { background: var(--accent); }
.summary-label { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.summary-value { font-family: 'Orbitron',monospace; font-size: 1.6rem; font-weight: 900; }
.s-hit   .summary-value { color: var(--green); }
.s-rate  .summary-value { color: var(--accent2); }
.s-profit .summary-value { color: var(--accent3); }
.s-total  .summary-value { color: var(--text); }
.summary-sub { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

/* フィルター */
.filter-bar {
  display: flex; gap: 8px; margin-bottom: 14px; align-items: center; flex-wrap: wrap;
}
.filter-btn {
  background: var(--surface3); border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 12px; font-weight: 700;
  font-family: inherit; transition: all 0.2s;
}
.filter-btn.active { background: var(--accent2); color: #000; border-color: var(--accent2); }
.filter-btn:hover:not(.active) { border-color: var(--accent3); color: var(--accent3); }

/* 記録テーブル */
.records-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.records-table { width: 100%; border-collapse: collapse; }
.records-table th {
  background: var(--surface3); padding: 10px 12px; text-align: left;
  font-size: 10px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}
.records-table td { padding: 10px 12px; border-bottom: 1px solid rgba(30,45,66,0.5); vertical-align: middle; }
.records-table tr:last-child td { border-bottom: none; }
.records-table tr:hover td { background: rgba(255,255,255,0.02); }

.badge-hit  { background: rgba(0,230,118,0.15); color: var(--green);  border: 1px solid rgba(0,230,118,0.3);  border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
.badge-miss { background: rgba(233,69,96,0.12); color: var(--accent); border: 1px solid rgba(233,69,96,0.25); border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
.badge-none { background: rgba(90,106,128,0.15); color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; }

.pred-list { display: flex; flex-wrap: wrap; gap: 3px; }
.pred-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 700;
  font-family: 'Orbitron',monospace; letter-spacing: 1px;
}
.pred-tag.本命 { background: rgba(233,69,96,0.15); color: var(--accent); border: 1px solid rgba(233,69,96,0.3); }
.pred-tag.対抗 { background: rgba(245,166,35,0.15); color: var(--accent2); border: 1px solid rgba(245,166,35,0.3); }
.pred-tag.穴   { background: rgba(0,230,118,0.12); color: var(--green); border: 1px solid rgba(0,230,118,0.25); }

.profit-plus { color: var(--green); font-weight: 700; }
.profit-minus { color: var(--accent); font-weight: 700; }

.btn-result {
  background: var(--surface3); border: 1px solid var(--accent3); color: var(--accent3);
  border-radius: 5px; padding: 4px 10px; font-size: 11px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.btn-result:hover { background: var(--accent3); color: #000; }
.btn-delete {
  background: none; border: 1px solid rgba(233,69,96,0.3); color: rgba(233,69,96,0.6);
  border-radius: 5px; padding: 4px 8px; font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.btn-delete:hover { border-color: var(--accent); color: var(--accent); }

/* モーダル */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; width: 360px; position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
}
.modal h3 { font-size: 14px; color: var(--accent2); margin-bottom: 16px; letter-spacing: 1px; }
.modal-row { margin-bottom: 12px; }
.modal-row label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.modal-row input {
  width: 100%; background: var(--input-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
  font-size: 14px; font-family: 'Orbitron',monospace; outline: none;
  transition: border-color 0.2s;
}
.modal-row input:focus { border-color: var(--accent3); }
.modal-btns { display: flex; gap: 8px; margin-top: 16px; }
.btn-modal-save {
  flex: 1; background: linear-gradient(135deg,var(--accent2),#e8920f);
  color: #000; border: none; border-radius: 6px; padding: 10px;
  font-size: 13px; font-weight: 900; cursor: pointer; font-family: inherit;
}
.btn-modal-cancel {
  background: var(--surface3); color: var(--text-muted); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 16px; cursor: pointer; font-family: inherit;
}
.result-combo-display {
  font-family: 'Orbitron',monospace; font-size: 20px; font-weight: 900;
  text-align: center; padding: 10px; margin: 8px 0;
  background: var(--surface3); border-radius: 6px; color: var(--accent3);
  letter-spacing: 3px;
}

.empty-msg { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; letter-spacing: 1px; }

/* グラフエリア */
.chart-section { margin-bottom: 16px; }
.chart-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
}
.chart-title { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
.bar-chart { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { font-size: 11px; color: var(--text-muted); width: 60px; text-align: right; flex-shrink: 0; }
.bar-track { flex: 1; background: var(--surface3); border-radius: 3px; height: 16px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; display: flex; align-items: center; padding-left: 6px; }
.bar-fill.hit-bar { background: linear-gradient(90deg,var(--green),#00a854); }
.bar-fill.profit-bar { background: linear-gradient(90deg,var(--accent3),#0099bb); }
.bar-val { font-size: 10px; font-weight: 700; color: #000; white-space: nowrap; }
</style>
</head>
<body>

<div class="header">
  <h1>🐻㊙ 裏熊 成績記録</h1>
  <a href="/" class="back-btn">← 予想ページへ</a>
</div>

<div class="main">

  <!-- サマリー -->
  <div class="summary-grid">
    <div class="summary-card s-hit">
      <div class="summary-label">的中数</div>
      <div class="summary-value" id="sum-hit">0</div>
      <div class="summary-sub" id="sum-total-races">全0レース</div>
    </div>
    <div class="summary-card s-rate">
      <div class="summary-label">的中率</div>
      <div class="summary-value" id="sum-rate">0%</div>
      <div class="summary-sub">結果入力済みのみ</div>
    </div>
    <div class="summary-card s-profit">
      <div class="summary-label">回収率</div>
      <div class="summary-value" id="sum-recover">0%</div>
      <div class="summary-sub" id="sum-profit-detail">収支: ±0円</div>
    </div>
    <div class="summary-card s-total">
      <div class="summary-label">収支合計</div>
      <div class="summary-value" id="sum-balance">±0</div>
      <div class="summary-sub" id="sum-payout-detail">払戻: 0円</div>
    </div>
  </div>

  <!-- グラフ -->
  <div class="chart-section" id="chart-section" style="display:none;">
    <div class="chart-card">
      <div class="chart-title">会場別 的中数</div>
      <div class="bar-chart" id="venue-chart"></div>
    </div>
  </div>

  <!-- フィルター -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all',this)">全期間</button>
    <button class="filter-btn" onclick="setFilter('month',this)">直近30日</button>
    <button class="filter-btn" onclick="setFilter('week',this)">直近7日</button>
  </div>

  <!-- 記録一覧 -->
  <div class="records-wrap">
    <table class="records-table">
      <thead>
        <tr>
          <th>日付</th>
          <th>会場</th>
          <th>R</th>
          <th>予想</th>
          <th>結果</th>
          <th>的中</th>
          <th>払戻</th>
          <th>収支</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="records-body">
        <tr><td colspan="9" class="empty-msg">記録がありません</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- 結果入力モーダル -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>🏁 レース結果を入力</h3>
    <input type="hidden" id="modal-record-id">
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px;" id="modal-race-info"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;">
      <div class="modal-row">
        <label>1着 艇番</label>
        <input type="number" id="r1st" min="1" max="6" placeholder="1">
      </div>
      <div class="modal-row">
        <label>2着 艇番</label>
        <input type="number" id="r2nd" min="1" max="6" placeholder="2">
      </div>
      <div class="modal-row">
        <label>3着 艇番</label>
        <input type="number" id="r3rd" min="1" max="6" placeholder="3">
      </div>
    </div>
    <div class="result-combo-display" id="modal-combo">?-?-?</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="modal-row">
        <label>払戻金額（円）</label>
        <input type="number" id="r-payout" placeholder="0" min="0">
      </div>
      <div class="modal-row">
        <label>購入金額（円）</label>
        <input type="number" id="r-purchase" placeholder="100" min="0" value="100">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-modal-save" onclick="submitResult()">保存する</button>
    </div>
  </div>
</div>

<script>
let currentFilter = 'all';
let allRecords = [];

// ======== 初期化 ========
async function loadRecords() {
  const resp = await fetch(`/get_records?period=${currentFilter}`);
  allRecords = await resp.json();
  renderRecords();
  renderSummary();
  renderVenueChart();
}

// ======== フィルター ========
function setFilter(period, btn) {
  currentFilter = period;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadRecords();
}

// ======== 一覧描画 ========
function renderRecords() {
  const tbody = document.getElementById('records-body');
  if (allRecords.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty-msg">記録がありません</td></tr>';
    return;
  }
  tbody.innerHTML = allRecords.map(r => {
    const predHtml = r.predictions.map(p =>
      `<span class="pred-tag ${p.type}">${p.combo}</span>`
    ).join('');

    const resultStr = r.result_1st
      ? `<span style="font-family:'Orbitron',monospace;font-weight:700;color:var(--accent3)">${r.result_1st}-${r.result_2nd}-${r.result_3rd}</span>`
      : '<span style="color:var(--text-muted)">未入力</span>';

    const hitBadge = r.result_1st
      ? (r.is_hit ? '<span class="badge-hit">◎ 的中</span>' : '<span class="badge-miss">× 不的中</span>')
      : '<span class="badge-none">-</span>';

    const payout = r.payout ? `${r.payout.toLocaleString()}円` : '-';
    const profit = r.payout && r.purchase
      ? `<span class="${r.payout - r.purchase >= 0 ? 'profit-plus' : 'profit-minus'}">${r.payout - r.purchase >= 0 ? '+' : ''}${(r.payout - r.purchase).toLocaleString()}円</span>`
      : '-';

    const resultBtn = r.result_1st
      ? `<button class="btn-result" onclick="openModal(${r.id},'${r.venue}',${r.race_no},'${r.race_date}')">修正</button>`
      : `<button class="btn-result" onclick="openModal(${r.id},'${r.venue}',${r.race_no},'${r.race_date}')">結果入力</button>`;

    return `<tr>
      <td>${r.race_date}</td>
      <td>${r.venue}</td>
      <td>${r.race_no}R</td>
      <td><div class="pred-list">${predHtml}</div></td>
      <td>${resultStr}</td>
      <td>${hitBadge}</td>
      <td>${payout}</td>
      <td>${profit}</td>
      <td style="display:flex;gap:4px;">
        ${resultBtn}
        <button class="btn-delete" onclick="deleteRecord(${r.id})">✕</button>
      </td>
    </tr>`;
  }).join('');
}

// ======== サマリー ========
function renderSummary() {
  const withResult = allRecords.filter(r => r.result_1st);
  const hits = withResult.filter(r => r.is_hit);
  const rate = withResult.length > 0 ? Math.round(hits.length / withResult.length * 100) : 0;
  const totalPayout = withResult.reduce((s,r) => s + (r.payout || 0), 0);
  const totalPurchase = withResult.reduce((s,r) => s + (r.purchase || 0), 0);
  const balance = totalPayout - totalPurchase;
  const recover = totalPurchase > 0 ? Math.round(totalPayout / totalPurchase * 100) : 0;

  document.getElementById('sum-hit').textContent = hits.length;
  document.getElementById('sum-total-races').textContent = `全${allRecords.length}レース`;
  document.getElementById('sum-rate').textContent = `${rate}%`;
  document.getElementById('sum-recover').textContent = `${recover}%`;
  document.getElementById('sum-profit-detail').textContent = `収支: ${balance >= 0 ? '+' : ''}${balance.toLocaleString()}円`;
  const balEl = document.getElementById('sum-balance');
  balEl.textContent = `${balance >= 0 ? '+' : ''}${balance.toLocaleString()}`;
  balEl.style.color = balance >= 0 ? 'var(--green)' : 'var(--accent)';
  document.getElementById('sum-payout-detail').textContent = `払戻: ${totalPayout.toLocaleString()}円`;
}

// ======== 会場別グラフ ========
function renderVenueChart() {
  const withResult = allRecords.filter(r => r.result_1st);
  if (withResult.length === 0) { document.getElementById('chart-section').style.display='none'; return; }
  document.getElementById('chart-section').style.display='block';

  const venueMap = {};
  withResult.forEach(r => {
    if (!venueMap[r.venue]) venueMap[r.venue] = { hit: 0, total: 0 };
    venueMap[r.venue].total++;
    if (r.is_hit) venueMap[r.venue].hit++;
  });
  const sorted = Object.entries(venueMap).sort((a,b) => b[1].hit - a[1].hit);
  const maxHit = Math.max(...sorted.map(([,v]) => v.hit), 1);

  document.getElementById('venue-chart').innerHTML = sorted.map(([venue, v]) => `
    <div class="bar-row">
      <div class="bar-label">${venue}</div>
      <div class="bar-track">
        <div class="bar-fill hit-bar" style="width:${v.hit/maxHit*100}%">
          <span class="bar-val">${v.hit}/${v.total}</span>
        </div>
      </div>
    </div>`).join('');
}

// ======== モーダル ========
function openModal(id, venue, race_no, race_date) {
  document.getElementById('modal-record-id').value = id;
  document.getElementById('modal-race-info').textContent = `${race_date} ${venue} ${race_no}R`;
  document.getElementById('r1st').value = '';
  document.getElementById('r2nd').value = '';
  document.getElementById('r3rd').value = '';
  document.getElementById('r-payout').value = '';
  document.getElementById('r-purchase').value = '100';
  document.getElementById('modal-combo').textContent = '?-?-?';
  document.getElementById('modal').classList.add('open');

  ['r1st','r2nd','r3rd'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateComboDisplay);
  });
}

function updateComboDisplay() {
  const v1 = document.getElementById('r1st').value;
  const v2 = document.getElementById('r2nd').value;
  const v3 = document.getElementById('r3rd').value;
  document.getElementById('modal-combo').textContent =
    `${v1||'?'}-${v2||'?'}-${v3||'?'}`;
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

async function submitResult() {
  const id = document.getElementById('modal-record-id').value;
  const r1 = parseInt(document.getElementById('r1st').value);
  const r2 = parseInt(document.getElementById('r2nd').value);
  const r3 = parseInt(document.getElementById('r3rd').value);
  const payout = parseInt(document.getElementById('r-payout').value) || 0;
  const purchase = parseInt(document.getElementById('r-purchase').value) || 100;

  if (!r1 || !r2 || !r3) { alert('1着・2着・3着を入力してください'); return; }

  const resp = await fetch('/update_result', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ id: parseInt(id), result_1st: r1, result_2nd: r2, result_3rd: r3, payout, purchase })
  });
  const data = await resp.json();
  closeModal();
  loadRecords();
}

// ======== 削除 ========
async function deleteRecord(id) {
  if (!confirm('この記録を削除しますか？')) return;
  await fetch('/delete_record', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ id })
  });
  loadRecords();
}

// モーダル外クリックで閉じる
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

loadRecords();
</script>
</body>
</html>
